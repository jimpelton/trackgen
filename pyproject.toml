[project]
name = "trackgen"
version = "0.2.0"
description = "A track generator that publishes LLA positions via ZMQ pub socket."
requires-python = ">=3.13,<3.15"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "scipy-stubs~=1.16.3",
    "pyzmq>=26.0.0",
    "pymap3d>=3.1.0",
    "pydantic>=2.13.2",
    "click>=8.1",
]

[project.scripts]
trackgen = "trackgen.cli:cli"

[dependency-groups]
dev = [
    "black>=25.12.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
